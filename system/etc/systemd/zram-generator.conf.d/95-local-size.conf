# Local override of Omarchy's 90-omarchy.conf (zram-size = ram).
# zstd compresses this workload ~2.2:1, so 1.5x RAM at the systemd-oomd kill
# threshold (90% swap used) still occupies only ~19 GB of the 32 GB. That buys
# ~6 GB of headroom before Brave gets killed. Added 2026-10-16.
[zram0]
zram-size = ram * 1.5
