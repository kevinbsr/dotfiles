# Flush the journal to disk every second instead of every five minutes.
#
# WHY: two suspend hangs on 2026-09-16 ended in a power-button reboot, and both
# times the journal stopped at the last flushed batch -- the second one at the
# very "PM: suspend entry" line, so there is no way to tell whether the kernel
# ever resumed. Whatever the tail of the next hang says, it will be on disk.
#
# Cost: one small write per second while messages are arriving, and none when
# the system is quiet.
[Journal]
SyncIntervalSec=1s
