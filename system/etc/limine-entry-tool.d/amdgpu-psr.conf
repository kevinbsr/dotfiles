# Disable PSR (Panel Self Refresh) on the AMD display engine.
#
# 2026-08-09: the display microcontroller started failing under load with
#   amdgpu 0000:06:00.0: [drm] *ERROR* Error queueing DMUB command: status=2
#   amdgpu 0000:06:00.0: [drm] *ERROR* dc_dmub_srv_log_diagnostic_data: DMCUB error
# at a rate of ~5/s, freezing the desktop hard enough that held keys repeated.
# Zero occurrences in every boot before that day, thousands after.
#
# 0x10 is DC_DISABLE_PSR. The panel reports "PSR support 1, sink PSR ver 1",
# so PSR is active by default and is the documented cause of this exact error
# signature on Renoir laptops.
#
# NOTE: PSR was equally enabled on the days with zero errors, so this is a
# tested hypothesis, not a proven cause. The other variable that changed the
# same morning is the compositor going from one GPU to two (AQ_DRM_DEVICES was
# removed to make the NVIDIA-wired HDMI/DP outputs reachable). If the errors
# survive this, that is the next thing to test -- one at a time.
KERNEL_CMDLINE[default]+=" amdgpu.dcdebugmask=0x10"

# ---------------------------------------------------------------------------
# 2026-08-29: workaround SUSPENSO para reteste.
#
# A NOTE acima previa exatamente isto: a causa nunca foi provada, e a variavel
# concorrente era o compositor dirigindo duas GPUs. Essa variavel mudou de novo
# desde entao -- nvidia_drm fbdev=0, roteamento de GPU corrigido no envs.lua, e
# a dGPU agora chega a D3cold e fica 100% do tempo dormindo. Kernel tambem
# mudou (7.1.8 -> 7.1.11). Neste boot, com o PSR desligado, o journal so tem as
# mensagens normais de carregamento do firmware do DMUB, nenhuma de erro.
#
# A rede de seguranca e o servico amdgpu-psr-watchdog: ele vigia o journal e
# escreve 1 em .../eDP-1/disallow_edp_enter_psr se aparecerem 5 erros de DMUB
# em 60s, matando o PSR em runtime antes de o desktop congelar. Isso importa
# porque esta maquina NAO tem TTY visivel (vtcon0 e dummy device), entao um
# desktop travado nao tem rota de recuperacao barata.
#
# Para reverter: apague o "#" da linha abaixo e rode `sudo limine-mkinitcpio`.
#KERNEL_CMDLINE[default]+=" amdgpu.dcdebugmask=0x10"

