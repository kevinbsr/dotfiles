# APST (Autonomous Power State Transition) dos SSDs NVMe.
#
# ANTES (desde 2026-05-18, sem justificativa registrada):
#   nvme_core.default_ps_max_latency_us=0    -> APST totalmente DESLIGADO
# O nome do arquivo sugere problema de suspensao, mas nada foi documentado e nao
# ha um unico erro de NVMe nos 31 boots que o journal guarda -- o que nao prova
# nada, ja que o workaround esteve ativo o tempo todo.
#
# AGORA (2026-08-30): valor intermediario escolhido a partir da tabela real de
# estados dos dois discos, lida com `nvme id-ctrl`:
#
#   nvme0 KIOXIA KBG50ZNS256G   ps3 0,050W exlat  1ms | ps4 0,003W exlat 44,9ms
#   nvme1 SSSTC  CL4-3D512-Q11  ps3 0,050W exlat 10ms | ps4 0,005W exlat 35,0ms
#
# 10000us (10ms) libera o ps3 dos DOIS discos e bloqueia os DOIS ps4.
# Racional: os ps4 sao justamente os estados de saida lenta (35-45ms) associados
# aos dropouts de APST, e o que eles economizam a mais e desprezivel -- 0,05W
# para 0,003W, cerca de 0,09W somando os dois discos. Todo o ganho real esta em
# sair dos 1,3-2,5W ociosos para os 0,05W do ps3. Trocar ~0,09W por um estado
# com 45ms de latencia de saida e risco de dropout nao se paga.
#
# Pior caso de acordar: 10ms na primeira I/O apos ocioso, absorvido pelo cache.
#
# SE APARECER QUALQUER `nvme ... I/O error`, `controller is down` ou timeout:
# voltar para 0 nesta linha e rodar `sudo limine-mkinitcpio`. Disco que some do
# barramento e ordem de magnitude pior que 1W.
KERNEL_CMDLINE[default]+="nvme_core.default_ps_max_latency_us=10000"
