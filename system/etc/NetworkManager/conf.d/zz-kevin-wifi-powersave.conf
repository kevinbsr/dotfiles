# Sobrepoe o omarchy-wifi-powersave.conf (conf.d le em ordem alfabetica, o
# ultimo vence). Aquele arquivo forca wifi.powersave=2 (desligado sempre),
# citando picos de latencia e firmware quebrado no Intel BE200/BE211.
#
# Esta maquina tem uma AX200 (lspci: "Wi-Fi 6 AX200 rev 1a"), entao a ressalva
# de firmware NAO se aplica. Sobra o argumento de latencia, que e real -- por
# isso o power save nao fica ligado sempre: fica ligado SO na bateria.
#
# valor 1 = "nao mexer". Quem passa a mandar e o /usr/local/bin/omarchy-wifi-powersave,
# chamado pela regra 99-wifi-powersave.rules em cada troca de fonte. Sem isto o
# NM reimpunha "off" a cada evento de conexao e a regra virava letra morta.
[connection]
wifi.powersave = 1
