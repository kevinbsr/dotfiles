# Nvidia dGPU options (G15 5515) — managed in dotfiles, supergfxd-friendly.
#
# RTD3 runtime power management: 0x02 lets the dGPU enter D3cold (full 0W)
# when idle in Hybrid mode, waking automatically (~1s) when an app needs it.
options nvidia NVreg_DynamicPowerManagement=0x02
#
# Carried over from the old EnvyControl nvidia.conf (kept for power/perf):
#   - InitializeSystemMemoryAllocations=0: skip zeroing all VRAM at init (lower power, faster resume)
#   - UsePageAttributeTable=1: faster CPU access to GPU memory
options nvidia NVreg_UsePageAttributeTable=1 NVreg_InitializeSystemMemoryAllocations=0
#
# S0ix: esta máquina só oferece s2idle (/sys/power/mem_sleep = [s2idle]), sem
# deep/S3 -- então dormir só economiza se cada dispositivo se apagar sozinho.
# Sem esta opção o driver reporta
#   S0ix Power Management: Platform Support: Supported / Status: Disabled
# e a dGPU atravessa a suspensão energizada. Medido em 2026-08-29: 3,58 W com a
# tampa fechada, contra os ~0,5-1 W de um s2idle saudável.
# Depende de NVreg_PreserveVideoMemoryAllocations=1, que já está em
# /etc/modprobe.d/nvidia-power-management.conf.
options nvidia NVreg_EnableS0ixPowerManagement=1
#
# fbdev=0: o driver liga a emulação de fbdev por PADRÃO junto com modeset=1
# (nenhum arquivo daqui pedia isso). Ela cria um framebuffer de console na VRAM
# da dGPU que NUNCA é liberado -- visto em
# /sys/kernel/debug/dri/0000:01:00.0/framebuffer como
#   allocated by = [fbcon]   refcount=1   size=1600x900
# Essa alocação é do próprio driver, então não aparece na lista de processos do
# nvidia-smi, e mantém "Video Memory: Active" mesmo com a sessão inteira fechada
# -- foi o que impediu o D3cold em 2026-08-29 (dGPU 100% acordada, ~10 W).
# Desligar afeta SÓ o console de framebuffer; modeset continua ligado, então as
# saídas HDMI-A-1 e DP-1 (que ficam nesta placa) seguem funcionando.
options nvidia_drm fbdev=0
