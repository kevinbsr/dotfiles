# Combined output: laptop speakers and the ASUS monitor's speakers at once.
#
# The VG34WQML5A carries audio over DisplayPort, off the NVIDIA card's HDA
# function at pci-0000:01:00.1. /proc/asound/card1/eld#0.4 confirms the monitor
# is there: monitor_name = VG34WQML5A, connection_type = DisplayPort.
#
# MATCH BY device.bus_path, NOT by node name. The card's ALSA profile changes on
# its own -- a DisplayPort modeset is enough to flip it -- and the sink is named
# after the profile. This rule first matched
# "alsa_output.pci-0000_01_00.1.HiFi__HDMI1__sink"; the profile later became
# output:hdmi-stereo, the sink was renamed to ...hdmi-stereo, and the monitor
# silently dropped out of the combined output with nothing reporting it. The bus
# path is the one thing that does not move.
#
# Unplugging the monitor is handled: a node that is not there is simply skipped,
# leaving the laptop speakers alone.
#
# To re-check the route after a hardware change:
#   grep -l VG34 /proc/asound/card1/eld*   -> the ELD that sees the monitor
#   pactl list sinks | grep -B20 01_00.1   -> the sink that card exposes now
context.modules = [
  { name = libpipewire-module-combine-stream
    args = {
      combine.mode = sink
      node.name = combine_speakers
      node.description = "Laptop + Monitor"
      media.class = Audio/Sink
      combine.latency-compensate = true
      combine.props = {
        audio.position = [ FL FR ]
      }
      stream.props = { }
      stream.rules = [
        { matches = [ { media.class = "Audio/Sink"
                        node.name = "alsa_output.pci-0000_06_00.6.HiFi__Speaker__sink" } ]
          actions = { create-stream = { } } }
        # Two rules for one monitor, because the NVIDIA card's ALSA profile
        # flips on its own and the sink is named after the profile. Under the
        # UCM "HiFi" profile the monitor is HDMI1 (hw:NVidia,3, and the node
        # nick reads VG34WQML5A); under output:hdmi-stereo the card collapses
        # to a single sink with a different name. Whichever exists gets a
        # stream, the other matches nothing and is skipped. Matching a stable
        # property instead is not possible: device.bus_path lives on the device
        # rather than the node, and node.nick only names the monitor under HiFi.
        { matches = [ { media.class = "Audio/Sink"
                        node.name = "alsa_output.pci-0000_01_00.1.HiFi__HDMI1__sink" } ]
          actions = { create-stream = { } } }
        { matches = [ { media.class = "Audio/Sink"
                        node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo" } ]
          actions = { create-stream = { } } }
      ]
    }
  }
]
