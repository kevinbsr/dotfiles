bindd = SUPER, XF86AudioMicMute, Switch audio input, exec, /home/kevin/.local/bin/omarchy-audio-input-switch
bindd = SUPER CTRL ALT, M, Switch audio input, exec, /home/kevin/.local/bin/omarchy-audio-input-switch
bindd = SUPER, M, Mute microphone, exec, /home/kevin/.local/share/omarchy/bin/omarchy-audio-input-mute

bindd = , F24, G-Mode toggle, exec, omarchy-gmode-dell-g15 toggle

bindd = SUPER CTRL, G, GPU mode (supergfxd), exec, omarchy-launch-walker -m menus:gpuswitcher --width 800 --minheight 400 --exit
bindd = SUPER CTRL ALT, S, Show Spotify playing track, exec, /home/kevin/.config/waybar/scripts/spotify-notification.sh





