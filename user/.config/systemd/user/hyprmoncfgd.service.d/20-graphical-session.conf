# Run hyprmoncfgd with the desktop session instead of from boot to shutdown.
#
# Living in default.target, it outlived every logout, spent the gap retrying
# "no running Hyprland instances found" every 5 s, and only noticed the new
# session at its next poll -- reapplying the profile (a config reload, twice)
# 3-8 s into the login, after the shell and apps were already up
# (login-timeline, 2026-09-15). It always applies once at startup, so bound to
# graphical-session.target that happens right as the session comes up. The
# service is enabled through graphical-session.target.wants, not default.target.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Install]
WantedBy=
WantedBy=graphical-session.target
