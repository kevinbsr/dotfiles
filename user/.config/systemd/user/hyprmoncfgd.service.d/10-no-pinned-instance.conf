# hyprmoncfgd outlives logouts (WantedBy=default.target), but if it is started
# while a session is up it inherits that session's HYPRLAND_INSTANCE_SIGNATURE
# from the user manager and keeps talking to it forever. After the next logout
# it logged "socket2 unavailable ... connection refused" every 5 s and stopped
# applying profiles (seen 2026-09-15 after omarchy-undock restarted it). Without
# the variable it discovers the running Hyprland instance by itself, as it does
# when it starts at boot before any session exists.
[Service]
UnsetEnvironment=HYPRLAND_INSTANCE_SIGNATURE
