# Run the gateway on mise's Node 24 instead of the system Node.
#
# openclaw 2026-09-12 requires Node >=24.16.0 <25 (or >=26.1.0). The system
# Node is deliberately held at 22 (nodejs-lts-jod): newer nodejs conflicts with
# what heroic-games-launcher pulls in, and that pin is what keeps `yay -Syu`
# working. So the gateway gets its own runtime rather than the pin moving.
#
# This is a drop-in, not an edit to the unit: openclaw-gateway.service is written
# by openclaw's installer and would lose a hand edit the next time it runs.
#
# `node/24` is mise's symlink to the newest installed 24.x, which keeps this
# inside the >=24.16 <25 range openclaw accepts without pinning a patch version.
# PATH puts the same Node first because the gateway spawns node children, and
# those would otherwise resolve /usr/bin/node and fail the same version check.

[Service]
ExecStart=
ExecStart=/home/kevin/.local/share/mise/installs/node/24/bin/node --max-old-space-size=8192 /usr/lib/node_modules/openclaw/dist/index.js gateway --port 18789
Environment=PATH=/home/kevin/.local/share/mise/installs/node/24/bin:/usr/bin:/usr/local/bin:/bin:/home/kevin/.local/bin:/home/kevin/.npm-global/bin:/home/kevin/bin:/home/kevin/.nix-profile/bin:/home/kevin/.local/share/pnpm
